name: Verification tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11.9'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest test_engine test_ui test_artwork test_performance_safety test_nsp test_compatibility test_emulator_patch test_dlc test_file_drops test_nup test_nup_ui test_nup_optimization test_nup_polish
